name: Verify Google API key identity

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: SHA-256 of the key shown in the intended Google AI Studio project
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare encrypted secret without exposing it
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import os

          key = os.environ.get("GOOGLE_API_KEY", "")
          expected = os.environ.get("EXPECTED_SHA256", "").lower()
          if len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected):
              raise SystemExit("Expected SHA-256 must be 64 hexadecimal characters")
          if not key:
              raise SystemExit("GOOGLE_API_KEY is not configured")

          actual = hashlib.sha256(key.encode()).hexdigest()
          if not hmac.compare_digest(actual, expected):
              raise SystemExit("NO MATCH: repository secret differs from the intended key")
          print("MATCH: repository secret equals the intended key")
          PY
