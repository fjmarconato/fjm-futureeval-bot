name: Refresh stale AI tournament forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  actions: write

jobs:
  request_refresh:
    if: vars.COMPETITIVE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue refresh through the shared coverage workflow
        uses: actions/github-script@v8
        env:
          NEXT_CONFIG_ACTIVATION_UTC: ${{ vars.NEXT_CONFIG_ACTIVATION_UTC }}
        with:
          script: |
            const activation = process.env.NEXT_CONFIG_ACTIVATION_UTC;
            if (!activation) {
              core.info("No refresh activation date is configured.");
              return;
            }
            const activationTime = Date.parse(activation);
            if (!Number.isFinite(activationTime)) {
              core.setFailed("NEXT_CONFIG_ACTIVATION_UTC is not a valid timestamp.");
              return;
            }
            if (Date.now() <= activationTime) {
              core.info("The refresh configuration is not active yet.");
              return;
            }
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: "run_bot_on_tournament.yaml", ref: "main",
              inputs: {
                publish: "true", use_next_config: "true", mode: "tournament",
                chain: "true", max_questions: "5", refresh_stale: "true",
              },
            });
            core.info("Queued one daily refresh; its coverage run will resume the normal loop.");
