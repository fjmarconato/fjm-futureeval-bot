name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish forecasts to Metaculus
        required: true
        default: false
        type: boolean
      use_next_config:
        description: Test the configuration scheduled for the next round
        required: true
        default: false
        type: boolean
      mode:
        description: Tournament target for a manual run
        required: true
        default: tournament
        type: choice
        options:
          - tournament
          - test_questions
      chain:
        description: Keep the reliable coverage loop running after this job
        required: true
        default: false
        type: boolean
      max_questions:
        description: Maximum questions for this manual run
        required: true
        default: 5
        type: number
  schedule:
    - cron: "11 */3 * * *" # backup bootstrap; chained dispatches provide normal coverage

permissions:
  actions: write
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: forecast-tournament-writes
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    if: (github.event_name == 'workflow_dispatch' && !inputs.chain) || vars.COMPETITIVE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 45
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          activate_next=false
          if [[ "${USE_NEXT_CONFIG}" == "true" ]]; then
            activate_next=true
          elif [[ -n "${NEXT_CONFIG_ACTIVATION_UTC}" && "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${NEXT_CONFIG_ACTIVATION_UTC}" ]]; then
            activate_next=true
          fi
          if [[ "${activate_next}" == "true" ]]; then
            : "${NEXT_FORECAST_MODEL:?NEXT_FORECAST_MODEL is required}"
            : "${NEXT_RESEARCH_MODEL:?NEXT_RESEARCH_MODEL is required}"
            : "${NEXT_PREDICTIONS_PER_RESEARCH_REPORT:?NEXT_PREDICTIONS_PER_RESEARCH_REPORT is required}"
            : "${NEXT_MAX_QUESTIONS_PER_RUN:?NEXT_MAX_QUESTIONS_PER_RUN is required}"
            export FORECAST_MODEL="${NEXT_FORECAST_MODEL}"
            export RESEARCH_MODEL="${NEXT_RESEARCH_MODEL}"
            export PREDICTIONS_PER_RESEARCH_REPORT="${NEXT_PREDICTIONS_PER_RESEARCH_REPORT}"
            export MAX_QUESTIONS_PER_RUN="${NEXT_MAX_QUESTIONS_PER_RUN}"
          fi
          run_mode="${MANUAL_MODE:-tournament}"
          args=(--mode "${run_mode}")
          if [[ "${PUBLISH_FORECASTS}" == "true" ]]; then
            args+=(--publish)
          fi
          poetry run python main.py "${args[@]}"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          FUTUREEVAL_TOURNAMENT_ID: fall-futureeval-2026
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }}
          FALLBACK_FORECAST_MODEL: ${{ vars.FALLBACK_FORECAST_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          PREDICTIONS_PER_RESEARCH_REPORT: ${{ vars.PREDICTIONS_PER_RESEARCH_REPORT }}
          RESEARCH_REPORTS_PER_QUESTION: ${{ vars.RESEARCH_REPORTS_PER_QUESTION }}
          MAX_QUESTIONS_PER_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.max_questions) || vars.MAX_QUESTIONS_PER_RUN || '5' }}
          LLM_REQUEST_COOLDOWN_SECONDS: 2
          PUBLISH_FORECASTS: ${{ github.event_name == 'schedule' || inputs.publish }}
          USE_NEXT_CONFIG: ${{ inputs.use_next_config || false }}
          NEXT_CONFIG_ACTIVATION_UTC: ${{ vars.NEXT_CONFIG_ACTIVATION_UTC }}
          NEXT_FORECAST_MODEL: ${{ vars.NEXT_FORECAST_MODEL }}
          NEXT_RESEARCH_MODEL: ${{ vars.NEXT_RESEARCH_MODEL }}
          NEXT_PREDICTIONS_PER_RESEARCH_REPORT: ${{ vars.NEXT_PREDICTIONS_PER_RESEARCH_REPORT }}
          NEXT_MAX_QUESTIONS_PER_RUN: ${{ vars.NEXT_MAX_QUESTIONS_PER_RUN || '5' }}
          MANUAL_MODE: ${{ inputs.mode || 'tournament' }}
      - name: Dispatch the next coverage cycle
        if: always() && (github.event_name == 'schedule' || inputs.chain)
        shell: bash
        run: |
          set -euo pipefail

          delay_seconds=480
          if [[ "${{ job.status }}" != "success" ]]; then
            delay_seconds=1200
          fi
          sleep "${delay_seconds}"

          active_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/run_bot_on_tournament.yaml/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' \
            | awk -v current="${GITHUB_RUN_ID}" '$0 != current { count++ } END { print count + 0 }')"
          if [[ "${active_runs}" != "0" ]]; then
            echo "A queued or running coverage cycle already exists; not dispatching another."
            exit 0
          fi

          gh workflow run run_bot_on_tournament.yaml \
            --ref main \
            -f publish=true \
            -f use_next_config=false \
            -f mode=tournament \
            -f chain=true \
            -f max_questions=5
        env:
          GH_TOKEN: ${{ github.token }}
