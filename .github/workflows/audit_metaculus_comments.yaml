name: Audit Metaculus comments for exposed credentials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit_metaculus_comments.yaml
      - audit_metaculus_comments.py
      - tests/test_audit_metaculus_comments.py

permissions:
  contents: read

concurrency:
  group: audit-metaculus-comments
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[audit-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 pytest==8.3.5
      - name: Test credential detectors
        run: python -m pytest tests/test_audit_metaculus_comments.py -q
      - name: Scan own public and private comments
        run: python audit_metaculus_comments.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
